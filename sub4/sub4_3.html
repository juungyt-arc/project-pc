<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업부 문의</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <script src="https://kit.fontawesome.com/212c075f99.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="./css/sub4_common.css">
    <link rel="stylesheet" href="./css/sub4_3.css">
</head>
<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">네비게이션바로가기</a>
    </div>
    <div id="wrap">
<header id="headerArea"></header>

    <div class="visual">
        <img src="./images/sub4_1/visual.png" alt="">  <!-- 사이즈 2000px x 350px --> 
        <strong class="hidden">고객지원</strong>
    </div>

    <div class="sub_nav">
        <ul>
            <li><a href="./sub4_1.html">자주묻는 질문</a></li>
            <li><a href="./sub4_2.html">단양공장견학</a></li>
            <li><a class="active" href="./sub4_3.html">사업부 문의</a></li>
        </ul>
    </div>

    <main id="content">
        <article>
            <div class="title_area">
                <div class="line_map">
                    <i class="fa-solid fa-house"></i> &gt; 고객지원 &gt; <strong>사업부 문의</strong>
                </div>
                <h2><span>Business Inquiries</span>사업부 문의</h2>
                <p>전문 상담팀이 빠르고 정확하게 답해드립니다</p>
            </div>
           <div class="join">
              <div class="join_inner">
                 <aside class="join_info">
                    <h2>사업부 문의하기</h2>
                    <p>전문 상담팀이 빠르고 정확하게<br>답변해 드립니다.</p>
                    <ul class="info_list">
                       <li>
                          <i class="fa-solid fa-phone"></i>
                          <div>
                             <strong>대표전화</strong>
                             <span>02-531-7000</span>
                          </div>
                       </li>
                       <li>
                          <i class="fa-solid fa-location-dot"></i>
                          <div>
                             <strong>본사 주소</strong>
                             <span>서울시 서초구 서초동 1587 한일시멘트빌딩</span>
                          </div>
                       </li>
                       <li>
                          <i class="fa-solid fa-clock"></i>
                          <div>
                             <strong>답변 안내</strong>
                             <span>접수 후 1~2일 이내 순차 회신</span>
                          </div>
                       </li>
                    </ul>
                 </aside>

                 <form class="join_form" method="post" id="contact-form">
                    <div class="field">
                       <label for="user_name">이름</label>
                       <input type="text" id="user_name" name="user_name" placeholder="이름을 입력하세요" required>
                    </div>
                    <div class="field">
                       <span class="field_label">핸드폰번호</span>
                       <div class="split">
                          <label for="hp1" class="hidden">핸드폰앞3자리</label>
                          <input type="text" id="hp1" name="hp1">
                          <em>-</em>
                          <label for="hp2" class="hidden">핸드폰중간4자리</label>
                          <input type="text" id="hp2" name="hp2">
                          <em>-</em>
                          <label for="hp3" class="hidden">핸드폰끝4자리</label>
                          <input type="text" id="hp3" name="hp3">
                       </div>
                    </div>
                    <div class="field">
                       <span class="field_label"><label for="user_email">이메일주소</label></span>
                       <div class="split">
                          <input type="text" id="user_email" name="user_email" placeholder="hanil123@gmail.com" required>
                       </div>
                    </div>
                    <div class="field">
                       <label for="user_dept">사업부 선택</label>
                       <select name="user_dept" id="user_dept">
                          <option value="">사업부를 선택하세요</option>
                          <option value="시멘트영업팀">시멘트영업팀</option>
                          <option value="레미콘영업팀">레미콘영업팀</option>
                          <option value="레미탈영업팀">레미탈영업팀</option>
                          <option value="단양공장 견학문의">단양공장 견학문의</option>
                          <option value="채용문의">채용문의</option>
                       </select>
                    </div>
                    <div class="field field_full">
                       <label for="user_title">제목</label>
                       <input type="text" id="user_title" name="user_title" placeholder="문의 제목을 입력하세요">
                    </div>
                    <div class="field field_full">
                       <label for="user_file">파일첨부</label>
                       <input type="file" id="user_file" name="user_file">
                    </div>
                    <div class="field field_full">
                       <label for="user_memo">문의내용</label>
                       <textarea name="user_memo" id="user_memo" placeholder="문의하실 내용을 자세히 작성해 주세요."></textarea>
                    </div>
                    <div class="field field_full agree">
                       <input type="checkbox" id="user_agree" name="user_agree">
                       <label for="user_agree">개인정보 수집 및 이용에 동의합니다.</label>
                    </div>
                    <div class="field field_full form_actions">
                       <button type="submit">메일 보내기</button>
                       <button type="reset">다시쓰기</button>
                    </div>
                 </form>
              </div>
           </div>
        </article>
    </main>  
<footer id="footerArea"></footer>
 </div>


   <script src="../js/jquery-1.12.4.min.js"></script>
   <script src="../js/jquery-migrate-1.4.1.min.js"></script>
   <script src="../js/jquery.easing.1.3.js"></script>
   <script>
        $('#headerArea').load('../common/sub_header.html',function(){
            //function(){}-> main_header.html의 로드가 완료되면..
            $.getScript('../js/fullnav.js');     //스크립트 js파일을 동작시키는 메소드
        });

        $('#footerArea').load('../common/sub_footer.html',function(){
            $.getScript('../js/select.js'); 
        });
   </script>
   <script src="../js/jquery-1.7.1.min.js"></script>
   <script src="../js/faq.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        (function() {
            // https://dashboard.emailjs.com/admin/account
            emailjs.init({
              publicKey: "PiPyqD_QOcE6xn7-I",
            });
        })();
    </script>
    <script>
            document.getElementById('contact-form').addEventListener('submit', function(event) {
                event.preventDefault();
                // these IDs from the previous steps
                emailjs.sendForm('service_ed1ixou', 'template_feq331o', this)
                    .then(() => {
                        console.log('SUCCESS!');
                        alert('메일 전송에 성공하였습니다.');
                    }, (error) => {
                        console.log('FAILED...', error);
                        alert('메일 전송에 실패하였습니다.');
                    });
            });
    </script>
</body>
</html>
